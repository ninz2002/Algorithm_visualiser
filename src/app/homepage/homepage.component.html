<div class="home">

  <!-- INTRO -->
  <section class="intro">
    <h1>
      Algorithms,
      <span>but visual.</span>
    </h1>

    <p>
      No dry theory. No memorization.
      Just watch how things move.
    </p>
  </section>

  <!-- CATEGORIES -->
  <div class="categories-container">
    <div class="category-section" *ngFor="let category of categorizedAlgorithms">
      
      <!-- Category Title -->
      <div class="category-header">
        <div class="category-line"></div>
        <h2 class="category-title">{{ category.name }}</h2>
        <div class="category-line"></div>
      </div>

      <!-- Algorithm Grid -->
      <div class="algo-grid">
        <div
          class="algo-tile"
          *ngFor="let algo of category.algorithms"
          (click)="goToAlgorithm(algo.route)"
        >

          <div class="tile-visual">

            <!-- Linear Search Preview -->
            <div class="array-preview" *ngIf="algo.route === '/linear-search'">
              <span>15</span>
              <span>7</span>
              <span class="active">23</span>
              <span>9</span>
            </div>

            <!-- Bubble Sort Preview -->
            <div class="array-preview bubble-sort-preview" *ngIf="algo.route === '/bubble-sort'">
              <span class="swapping-1">34</span>
              <span class="swapping-2">12</span>
              <span>25</span>
              <span>64</span>
            </div>

            <!-- DFS Preview -->
              <div class="dfs-preview" *ngIf="algo.route === '/dfs'">
                <!-- SVG edges drawn first so nodes sit on top -->
                <svg class="dfs-edges" viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">
                <!-- Root A → B (left child) -->
                <line x1="60" y1="14" x2="24" y2="50" class="dfs-edge" style="--d:0.1s"/>
                <!-- Root A → C (right child) -->
                <line x1="60" y1="14" x2="96" y2="50" class="dfs-edge" style="--d:0.3s"/>
                <!-- B → D (left grandchild) -->
                <line x1="24" y1="62" x2="12" y2="82" class="dfs-edge" style="--d:0.5s"/>
                <!-- C → E (right grandchild) -->
                <line x1="96" y1="62" x2="108" y2="82" class="dfs-edge" style="--d:0.7s"/>
              </svg>

              <!-- Nodes -->
              <div class="dfs-node visited" style="left:50%;top:0;--d:0s">A</div>
              <div class="dfs-node visited" style="left:23%;top:55%;--d:0.2s">B</div>
              <div class="dfs-node"        style="left:77%;top:55%;--d:0.4s">C</div>
              <div class="dfs-node active" style="left:2%;top:98%;--d:0.6s">D</div>
              <div class="dfs-node"        style="left:96%;top:98%;--d:0.8s">E</div>
            </div>

            <!-- N-Queens Preview -->
            <div class="chess-board-preview" *ngIf="algo.route === '/n-queens'">
              <div class="chess-row">
                <span class="chess-cell"></span>
                <span class="chess-cell queen">♛</span>
              </div>
              <div class="chess-row">
                <span class="chess-cell queen">♛</span>
                <span class="chess-cell"></span>
              </div>
            </div>
          </div>

          <div class="tile-info">
            <h3>{{ algo.title }}</h3>
            <span class="tagline">{{ algo.tagline }}</span>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>
